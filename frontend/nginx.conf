upstream api_backend {
    server ${BACKEND_HOST}:${BACKEND_PORT};
    keepalive 32;
    keepalive_timeout 300s;
    keepalive_requests 10000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    keepalive_timeout 300s;
    keepalive_requests 10000;

    root /usr/share/nginx/html;
    index index.html;

    # Certbot HTTP-01 Webroot Validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-XSS-Protection            "1; mode=block"                        always;
    add_header Strict-Transport-Security   "max-age=15552000; includeSubDomains"  always;
    add_header X-Content-Type-Options      "nosniff"                              always;
    add_header X-Frame-Options             "SAMEORIGIN"                           always;
    add_header Referrer-Policy             "no-referrer"                          always;
    add_header Cross-Origin-Opener-Policy  "same-origin"                          always;
    add_header Cross-Origin-Resource-Policy "same-origin"                         always;
    # connect-src inclui o Keycloak (SSO Portal CWO) — configurável via env KC_ORIGIN
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${KC_ORIGIN}; font-src 'self'; object-src 'none';" always;

    # Rewrite for docs
    location = /api/docs {
        return 302 https://$http_host/api/docs/;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port ${HTTPS_PORT};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Admin-Key $http_x_admin_key;

        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Content-Security-Policy;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html { internal; }
    location = /50x.html { internal; }
}
